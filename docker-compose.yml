networks:
  rips-net:
    driver: bridge
  fevrips-net:
    external: true

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:17
    container_name: rips-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rips-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rips_275-backend:latest
    container_name: rips-backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DB_HOST: rips-db
    networks:
      - rips-net
      - fevrips-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    image: rips_275-frontend:latest
    container_name: rips-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - rips-net
